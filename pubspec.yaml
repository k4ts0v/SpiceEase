name: spiceease
description: A new Flutter project.

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  provider: ^6.1.1
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  shared_preferences: ^2.2.1
  path_provider: ^2.1.1
  dio: ^5.4.0
  flutter_secure_storage: ^10.0.0-beta.4
  analyzer: ^7.4.1
  flutter_riverpod: ^2.6.1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_localization: ^0.3.2
  table_calendar: ^3.0.9
  collection: ^1.17.0
  font_awesome_flutter: ^10.4.0
  syncfusion_flutter_charts: ^29.2.4
  flutter_local_notifications: ^17.2.1+2
  timeago: ^3.5.0
  rxdart: ^0.27.7
  timezone: ^0.9.2
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1
  package_info_plus: ^8.3.0
  url_launcher: ^6.1.0

dev_dependencies:
  flutter_dotenv: ^5.2.1
  build_runner: ^2.4.15
  uuid: ^4.5.1
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  integration_test:
    sdk: flutter


flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/icons/spiceease_logo.png
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/spiceease_logo.png"
  adaptive_icon_foreground: "assets/icons/spiceease_logo.png"
  adaptive_icon_background: "#ffffff"
